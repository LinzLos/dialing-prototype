name: Tiny Wire drift check

# Verifies the vendored Tiny Wire tokens in src/lib/ match the pinned
# upstream release byte for byte (src/lib/.tinywire-version vs tiny-wire's
# VERSION file). Upstream tags releases as v<version>, so we check out the
# tag matching this repo's pin. This catches hand-edited vendored files and
# a pin that doesn't match its tagged source; a pin pointing at a tag that
# doesn't exist yet fails at checkout, which is also drift.

on:
  push:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dialing-prototype
        uses: actions/checkout@v4

      - name: Read pinned Tiny Wire version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < src/lib/.tinywire-version)" >> "$GITHUB_OUTPUT"

      - name: Check out tiny-wire at pinned tag
        uses: actions/checkout@v4
        with:
          repository: LinzLos/tiny-wire
          ref: v${{ steps.pin.outputs.version }}
          path: tiny-wire

      # actions/checkout can only place repos inside the workspace, so
      # tiny-wire lands in a subdirectory rather than the sibling directory
      # the script defaults to. Point TW_REPO_DIR at it explicitly.
      - name: Run drift check
        env:
          TW_REPO_DIR: ${{ github.workspace }}/tiny-wire
        run: bash scripts/check-tinywire-drift.sh
